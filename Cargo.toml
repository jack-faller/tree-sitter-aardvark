[package]
name = "tree-sitter-aardvark"
description = "Parser for the Aardvark language grammar, used also by AaScript."
version = "0.1.0"
authors = ["Jack Faller <jack.t.faller@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "aardvark"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/jack-faller/tree-sitter-aardvark.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
